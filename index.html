// Client-side primer extraction
function extractPrimerTerms(text){
  const clean=text.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/_([^_]+)_/g,'$1');
  const sentences=clean.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.length>10);

  const locations=[], groups=[], events=[], concepts=[];
  const seen=new Set();

  // Known fantasy location words
  const locWords=/\b(Kingdom|City|Capital|Town|Village|Forest|Mountain|Coast|Basin|Frontier|Border|Keep|Ruins|Woods|Steps|Wastes|Sea|Crossing|Port|Outpost|Hollow|Haven)\b/i;
  const groupWords=/\b(Faith|Order|Tribe|Army|Crown|Church|Guild|Council|People|Forces)\b/i;
  const eventWords=/\b(Sundering|War|Battle|Siege|Fall|Sacrifice|Age|Era)\b/i;

  // Find "The X" proper noun patterns and standalone capitalized phrases
  const thePatterns=[...clean.matchAll(/(?:the\s+)([A-Z][a-z]+(?:\s+(?:of\s+(?:the\s+)?)?[A-Z][a-z]+)*)/g)];
  const standalonePatterns=[...clean.matchAll(/\b([A-Z][a-z]{2,}(?:\s+[A-Z][a-z]+)+)\b/g)];

  const allMatches=[...thePatterns,...standalonePatterns];

  for(const match of allMatches){
    const name=match[1].trim();
    if(name.length<4||name.length>50)continue;
    if(seen.has(name.toLowerCase()))continue;
    // Skip common English phrases
    if(/^(They|Then|There|These|Those|This|That|When|What|Where|Some|Many|Most|Every|After|Before|Behind|Between|Through|During|Still|Their|From|Into|Over|Under|About|Each|Other|Another)\b/.test(name))continue;
    if(/^(No one|In the|At the|On the|For the|And the|But the|With the)\b/i.test(name))continue;

    seen.add(name.toLowerCase());

    // Find context sentence
    const contextSentence=sentences.find(s=>s.includes(name));
    let context='';
    if(contextSentence){
      // Try to get a short clause about this term
      const idx=contextSentence.indexOf(name);
      const after=contextSentence.slice(idx+name.length).trim();
      const clause=after.match(/^[,:]?\s*(.{10,80}?)(?:[,.]|$)/);
      if(clause)context=clause[1].trim().replace(/^(is|are|was|were|have|has)\s+/i,(m)=>m.toLowerCase());
      if(!context&&contextSentence.length<120)context=contextSentence;
    }

    // Categorize
    if(locWords.test(name))locations.push({name:'The '+name,context});
    else if(groupWords.test(name))groups.push({name:'The '+name,context});
    else if(eventWords.test(name))events.push({name:'The '+name,context});
    else concepts.push({name,context});
  }

  // Also find "called the X" / "known as the X" patterns
  const calledPatterns=[...clean.matchAll(/(?:called|known as|named)\s+the\s+([A-Z][a-z]+(?:\s+(?:of\s+(?:the\s+)?)?[A-Z][a-z]+)*)/gi)];
  for(const m of calledPatterns){
    const name=m[1].trim();
    if(seen.has(name.toLowerCase()))continue;
    seen.add(name.toLowerCase());
    const ctx=sentences.find(s=>s.includes(name));
    const shortCtx=ctx&&ctx.length<120?ctx:'';
    concepts.push({name,context:shortCtx});
  }

  return {locations:locations.slice(0,12),groups:groups.slice(0,8),events:events.slice(0,6),concepts:concepts.slice(0,8)};
}

function archiveSession(){
  if(!state.notes||!state.notes.trim())return;
  const entry={
    date:state.currentSessionDate||new Date().toISOString().slice(0,10),
    notes:state.notes.trim(),
    id:Date.now()
  };
  if(!state.sessionHistory)state.sessionHistory=[];
  state.sessionHistory.unshift(entry);
  state.notes='';
  state.currentSessionDate=new Date().toISOString().slice(0,10);
  saveState();renderSheet();
}
function deleteSessionEntry(id){
  state.sessionHistory=state.sessionHistory.filter(e=>e.id!==id);
  saveState();renderSheet();
}
function toggleSessionEntry(id){
  const el=document.getElementById('se-'+id);
  if(el)el.classList.toggle('open');
}
function toggleSidebarCard(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('open');
  const btn=el?.previousElementSibling?.querySelector('.sidebar-card-toggle');
  if(btn)btn.textContent=el.classList.contains('open')?'collapse':'expand';
  if(!state.sidebarState)state.sidebarState={};
  state.sidebarState[id]=el?.classList.contains('open')||false;
  saveState();
}

// ══════════════════════════════════════════════════
// AUTO-LOAD LAST CHARACTER
// ══════════════════════════════════════════════════
(function(){
  try{
    const lastKey=localStorage.getItem('dh-last-char');
    if(lastKey){const raw=localStorage.getItem(lastKey+'-char');if(raw){CHAR=JSON.parse(raw);loadState();renderSheet();showScreen('sheet');return}}
  }catch(e){}
})();
// Override saveChar to track last loaded
const _origSaveChar=saveChar;
saveChar=function(){_origSaveChar();try{localStorage.setItem('dh-last-char',storageKey())}catch(e){}}
</script>
